name: CI Build & Tests

on:
  push:
    branches: [ "main", "develop", "chore/s0-7-env-ci" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build & Test Spring Boot
        run: |
          if [ -f backend/mvnw ]; then
            cd backend && chmod +x ./mvnw && ./mvnw test
          else
            echo "Backend non encore initialisé"
          fi

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & Build React Vite
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm ci && npm run build
          else
            echo "Frontend non encore initialisé"
          fi